<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="dashboard.css"/>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <img src="https://placehold.co/100x100" alt="Profile picture of a cat">
            <h2>Ariane Bangquiao</h2>
            <div class="courses">
                <h3>COURSES</h3>
                <button>HCI</button>
                <button>SE 101</button>
                <button>ATFL 101</button>
                <button>FBA 101</button>
                <button class="active">PROGRAMMING</button>
            </div>
        </div>
        <div class="main-content">
            <div class="search-bar">
                <input type="text" placeholder="Search">
            </div>
            <div class="header-icons">
                <i class="fas fa-cog"></i>
            </div>
            <div class="subjects">
                <h3>SUBJECTS</h3>
                <div class="subject-list">
                    <img src="https://placehold.co/100x100" alt="Subject 1">
                    <img src="https://placehold.co/100x100" alt="Subject 2">
                    <img src="https://placehold.co/100x100" alt="Subject 3">
                    <img src="https://placehold.co/100x100" alt="Subject 4">
                    <img src="https://placehold.co/100x100" alt="Subject 5">
                </div>
            </div>
            <div class="quizzes">
                <h3>AVAILABLE QUIZZES</h3>
                <ul class="quiz-list">
                    <li>Artificial intelligence and machine learning</li>
                    <li>Blockchain technology</li>
                    <li>Human-computer interaction (HCI)</li>
                    <li>Software maintenance and evolution</li>
                </ul>
                <button class="quiz-history">Quizzes History</button>
            </div>
        </div>
    </div>
    <script>src="dashboard.js"</script>
</body>
</html>
