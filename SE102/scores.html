<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/scores.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="profile">
                <img src="profile-image.jpg" alt="Profile Image" class="profile-img">

            </div>
            <div class="courses">
                <h3>COURSES</h3>
                <ul>
                    <li>HC1</li>
                    <li>SE 101</li>
                    <li>APPL 101</li>
                    <li>PDA 120</li>

                </ul>
            </div>
        </div>
        <div class="main-content">
            <h2>Dashboard</h2>

                <p>35/50</p>
                <p>Time: 75 mins</p>
                <button class="view-answers">View Answers</button>
            </div>
        </div>
    </div>
</body>
</html>
